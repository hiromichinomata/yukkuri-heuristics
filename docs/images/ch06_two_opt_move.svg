<text x="40.0" y="40.0" font-family="Hiragino Sans, Noto Sans CJK JP, Meiryo, sans-serif" font-size="12" fill="#ea580c" text-anchor="start" font-weight="bold">前: a→b, c→d（交差している）</text>
<line x1="380.0" y1="80.0" x2="380.0" y2="200.0" stroke="#16a34a" stroke-width="3"/>
<line x1="540.0" y1="200.0" x2="540.0" y2="80.0" stroke="#16a34a" stroke-width="3"/>
<line x1="350.0" y1="50.0" x2="380.0" y2="80.0" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="540.0" y1="80.0" x2="570.0" y2="50.0" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M 540 200 C 600 220, 320 220, 380 200" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
