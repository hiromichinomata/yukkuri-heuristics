<svg xmlns="http://www.w3.org/2000/svg" width="620" height="240" viewBox="0 0 620 240" role="img">
<title>第6章: 2-opt — 交差する 2 本の辺 (a,b) (c,d) を (a,c) (b,d) に付け替える</title>
<rect x="0" y="0" width="620" height="240" fill="#ffffff"/>
