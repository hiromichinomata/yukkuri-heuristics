<line x1="30.0" y1="50.0" x2="60.0" y2="80.0" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="220.0" y1="80.0" x2="250.0" y2="50.0" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M 220 200 C 280 220, 0 220, 60 200" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="60.0" cy="80.0" r="5" fill="#111827" stroke="none" stroke-width="1.0"/>
<text x="44.0" y="85.0" font-family="Hiragino Sans, Noto Sans CJK JP, Meiryo, sans-serif" font-size="14" fill="#111827" text-anchor="start" font-weight="bold">a</text>
<circle cx="220.0" cy="200.0" r="5" fill="#111827" stroke="none" stroke-width="1.0"/>
<text x="230.0" y="205.0" font-family="Hiragino Sans, Noto Sans CJK JP, Meiryo, sans-serif" font-size="14" fill="#111827" text-anchor="start" font-weight="bold">b</text>
<circle cx="60.0" cy="200.0" r="5" fill="#111827" stroke="none" stroke-width="1.0"/>
<text x="44.0" y="205.0" font-family="Hiragino Sans, Noto Sans CJK JP, Meiryo, sans-serif" font-size="14" fill="#111827" text-anchor="start" font-weight="bold">c</text>
<circle cx="220.0" cy="80.0" r="5" fill="#111827" stroke="none" stroke-width="1.0"/>
