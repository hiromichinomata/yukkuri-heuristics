<text x="364.0" y="85.0" font-family="Hiragino Sans, Noto Sans CJK JP, Meiryo, sans-serif" font-size="14" fill="#111827" text-anchor="start" font-weight="bold">a</text>
<circle cx="540.0" cy="200.0" r="5" fill="#111827" stroke="none" stroke-width="1.0"/>
<text x="550.0" y="205.0" font-family="Hiragino Sans, Noto Sans CJK JP, Meiryo, sans-serif" font-size="14" fill="#111827" text-anchor="start" font-weight="bold">b</text>
<circle cx="380.0" cy="200.0" r="5" fill="#111827" stroke="none" stroke-width="1.0"/>
<text x="364.0" y="205.0" font-family="Hiragino Sans, Noto Sans CJK JP, Meiryo, sans-serif" font-size="14" fill="#111827" text-anchor="start" font-weight="bold">c</text>
<circle cx="540.0" cy="80.0" r="5" fill="#111827" stroke="none" stroke-width="1.0"/>
<text x="550.0" y="85.0" font-family="Hiragino Sans, Noto Sans CJK JP, Meiryo, sans-serif" font-size="14" fill="#111827" text-anchor="start" font-weight="bold">d</text>
<text x="360.0" y="40.0" font-family="Hiragino Sans, Noto Sans CJK JP, Meiryo, sans-serif" font-size="12" fill="#16a34a" text-anchor="start" font-weight="bold">後: a→c, b→d（区間 b…c を反転）</text>
<line x1="270.0" y1="140.0" x2="330.0" y2="140.0" stroke="#111827" stroke-width="2"/>
<line x1="330.0" y1="140.0" x2="323.1" y2="144.1" stroke="#111827" stroke-width="2"/>
<line x1="330.0" y1="140.0" x2="323.1" y2="135.9" stroke="#111827" stroke-width="2"/>
<text x="20.0" y="230.0" font-family="Hiragino Sans, Noto Sans CJK JP, Meiryo, sans-serif" font-size="11" fill="#9ca3af" text-anchor="start" font-weight="normal">点線 = 巡回の残り。dist(a,c) + dist(b,d) &lt; dist(a,b) + dist(c,d) なら採用する</text>
</svg>
