<text x="330.0" y="140.0" font-family="Hiragino Sans, Noto Sans CJK JP, Meiryo, sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="normal">左上から順に辺を見て、</text>
<text x="330.0" y="158.0" font-family="Hiragino Sans, Noto Sans CJK JP, Meiryo, sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="normal">find(u) == find(v) なら</text>
<text x="330.0" y="176.0" font-family="Hiragino Sans, Noto Sans CJK JP, Meiryo, sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="normal">閉路ができるので弾く</text>
<text x="330.0" y="206.0" font-family="Hiragino Sans, Noto Sans CJK JP, Meiryo, sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="normal">判定は 1 本あたり</text>
<text x="330.0" y="224.0" font-family="Hiragino Sans, Noto Sans CJK JP, Meiryo, sans-serif" font-size="12" fill="#2563eb" text-anchor="start" font-weight="bold">ほぼ O(1)</text>
<text x="330.0" y="242.0" font-family="Hiragino Sans, Noto Sans CJK JP, Meiryo, sans-serif" font-size="12" fill="#9ca3af" text-anchor="start" font-weight="normal">（全体を数え直すと O(V+E)）</text>
<text x="20.0" y="320.0" font-family="Hiragino Sans, Noto Sans CJK JP, Meiryo, sans-serif" font-size="11" fill="#9ca3af" text-anchor="start" font-weight="normal">空きマス 21 個を、閉路を作らずに 1 つにつなぐと、辺はちょうど「マスの数 − 1」本になる</text>
